server {
    listen 80;

    # 1. Serve the React Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # This is the magic line that fixes the 404 errors
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy Backend Requests
    # Assuming your API routes start with something like /api/ 
    # (Adjust this path if your backend routes start differently)
    location /api/ {
        # 'backend' is the exact service name from your docker-compose.yml
        # '8005' is the internal port your backend is listening on
        proxy_pass http://192.168.1.4:8005 ;
        
        # Forward necessary headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}